name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── JavaScript (ESLint) ──────────────────────────────────────────────────────
  js-lint:
    name: ESLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint "extension/**/*.js"

  # ── Python (ruff) ────────────────────────────────────────────────────────────
  python-lint:
    name: ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.4.7

      - name: Check style
        run: ruff check native-host/browser_switch_host.py

      - name: Check formatting
        run: ruff format --check native-host/browser_switch_host.py

  # ── Shell scripts (shellcheck) + JSON + manifest refs ────────────────────────
  shell-and-manifest:
    name: shellcheck + JSON + manifest refs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: shellcheck
        run: shellcheck native-host/install.sh native-host/install-macos.sh

      - name: Validate JSON files
        run: |
          python -m json.tool extension/manifest.json        > /dev/null
          python -m json.tool native-host/com.browserswitch.host.json > /dev/null
          echo "JSON: OK"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check manifest file references
        run: python scripts/check_manifest_refs.py
