version: 2

updates:
  # ── npm ──────────────────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # Wait 7 days after a release before opening a PR (30 days for majors).
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # Minor and patch devDependency bumps land in a single PR.
      npm-dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Major devDependency bumps each get their own PR (no group entry needed;
      # they fall through to the default one-PR-per-dependency behaviour).

  # ── GitHub Actions ───────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # All Actions minor/patch updates in one PR; majors stay separate.
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
